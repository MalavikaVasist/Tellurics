
# Experiment 1: whole-night telluric regression with the Perceiver night model.
#
# Predicts the full-night telluric transmission T_hat (B, T=73, N=51556) from
# observed spectra X = T*S, per night. This manifest mirrors the schema of the
# canonical runnable config `configs/night_perceiver.json` (lowercase section
# keys, snake_case fields, enum-valid values) so it stays consistent with the
# pydantic configs in `tellurics.configs` (ModelConfig / TrainingConfig).
#
# The training data (night-major HDF5) is not part of this config: it is given
# on the command line, e.g.
#   python -m tellurics.scripts.train_night \
#       --night-h5 data/night_dataset.h5 --config <this file / a .json twin>

model:
  architecture: perceiver_night          # ModelArchitecture enum value
  num_wavelength_bins: 51556             # spectral samples N per exposure
  num_atm_parameters: 6
  fusion_method: film                    # FusionMethod enum value
  n_frames_per_series: 73                # exposures T per night
  num_queries: 16                        # learned Perceiver latents Q
  spectral_latent_dim: 64                # per-exposure code dim d
  spectral_encoder_dims: [2048, 512, 128]
  metadata_dim: 11                       # per-night metadata vector length
  use_time_embed: true
  hidden_dim: 256
  num_heads: 4
  num_layers: 1
  dropout: 0.1
  predict_spectral_dim: 0                # 0 -> use num_wavelength_bins

training:
  optimizer:
    optimizer_type: adamw                # OptimizerType enum value
    learning_rate: 1e-4
    weight_decay: 1e-4
  scheduler:
    scheduler_type: cosine               # SchedulerType enum value
    min_lr: 1e-6
  max_epochs: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  precision: 16-mixed
  early_stopping_patience: 15
  seed: 42


